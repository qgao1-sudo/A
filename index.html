<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交互式小游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
            animation: fadeInDown 0.8s ease;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .game-container {
            width: 100%;
            max-width: 1200px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            animation: fadeInUp 0.8s ease;
        }

        .game-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 141.4%; /* A4 比例 (297/210) */
        }

        .game-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 20px;
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #667eea;
            color: white;
        }

        .fullscreen-btn {
            background: #28a745;
            color: white;
        }

        .fullscreen-btn:hover {
            background: #218838;
        }

        .info {
            text-align: center;
            color: white;
            margin-top: 20px;
            font-size: 14px;
            opacity: 0.8;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .header p {
                font-size: 0.9em;
            }

            .btn {
                padding: 10px 20px;
                font-size: 14px;
            }

            body {
                padding: 10px;
            }
        }

        /* 全屏模式样式 */
        .game-container:fullscreen {
            max-width: 100%;
            border-radius: 0;
        }

        .game-container:-webkit-full-screen {
            max-width: 100%;
            border-radius: 0;
        }

        .game-container:-moz-full-screen {
            max-width: 100%;
            border-radius: 0;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎮 交互式小游戏</h1>
        <p>点击PDF中的元素开始体验互动内容</p>
    </div>

    <div class="game-container" id="gameContainer">
        <div class="game-wrapper">
            <embed
                class="game-frame"
                src="Untitled (1).pdf"
                type="application/pdf"
                id="pdfEmbed"
            >
        </div>

        <div class="controls">
            <button class="btn btn-primary" onclick="reloadGame()">
                🔄 重新开始
            </button>
            <button class="btn fullscreen-btn" onclick="toggleFullscreen()">
                ⛶ 全屏模式
            </button>
            <button class="btn btn-secondary" onclick="downloadGame()">
                ⬇️ 下载游戏
            </button>
        </div>
    </div>

    <div class="info">
        <p>💡 提示：某些浏览器可能需要下载PDF才能体验完整的交互功能</p>
        <p>推荐使用 Chrome、Firefox 或 Safari 浏览器获得最佳体验</p>
    </div>

    <script>
        // 重新加载游戏
        function reloadGame() {
            const embed = document.getElementById('pdfEmbed');
            const src = embed.src;
            embed.src = '';
            setTimeout(() => {
                embed.src = src;
            }, 100);
        }

        // 全屏切换
        function toggleFullscreen() {
            const container = document.getElementById('gameContainer');

            if (!document.fullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                } else if (container.mozRequestFullScreen) {
                    container.mozRequestFullScreen();
                } else if (container.msRequestFullscreen) {
                    container.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }

        // 下载游戏
        function downloadGame() {
            const link = document.createElement('a');
            link.href = 'Untitled (1).pdf';
            link.download = 'Interactive-Game.pdf';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            // F11 或 F 键切换全屏
            if (e.key === 'F11' || e.key === 'f') {
                e.preventDefault();
                toggleFullscreen();
            }
            // R 键重新开始
            if (e.key === 'r' || e.key === 'R') {
                reloadGame();
            }
        });

        // 检测浏览器是否支持PDF嵌入
        window.addEventListener('load', () => {
            const embed = document.getElementById('pdfEmbed');

            // 如果浏览器不支持PDF嵌入，提供备选方案
            setTimeout(() => {
                if (!embed.offsetHeight || embed.offsetHeight < 100) {
                    console.log('PDF embed may not be supported');
                    // 可以在这里添加降级方案
                }
            }, 2000);
        });
    </script>
</body>
</html>
